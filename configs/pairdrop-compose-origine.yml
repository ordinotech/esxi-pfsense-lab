---
services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=Etc/UTC
      - RATE_LIMIT=false
      - WS_FALLBACK=false
      - RTC_CONFIG= #optional
      - DEBUG_MODE=false
    ports:
      - 3000:3000
    restart: unless-stopped
